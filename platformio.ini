[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    luni64/TeensyTimerTool@^1.5.0
build_flags =
    -O2
    -std=c++17
monitor_speed = 115200
monitor_port = /dev/ttyACM*
upload_protocol = teensy-cli

; Optional: STM32F4 target (comment out teensy41 above)
; [env:stm32f407]
; platform = ststm32
; board = disco_f407vg
; framework = arduino
; build_flags = -O2 -std=c++17
